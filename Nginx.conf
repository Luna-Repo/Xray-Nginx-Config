worker_processes auto;
pid /run/nginx.pid;
error_log /var/log/nginx/error.log;
include /etc/nginx/modules-enabled/*.conf;

events {
    worker_connections 768;
    # multi_accept on;
}

#基于SNI分流
stream {
    map $ssl_preread_server_name $backend {
        reality.a.com reality;    #reality伪装域名
        your.domain.com web_xray; #填入你的域名
        default drop;
    }

    upstream reality {
        server 127.0.0.1:10002; #reality端口
    }

    upstream web_xray {
        server 127.0.0.1:10000; #web_xray端口
    }

    upstream drop {
        server 0.0.0.0:1; #丢弃数据包
    }

    server {
        listen 443 reuseport;#监听443tcp
        proxy_pass $backend;
        ssl_preread on;
    }
}

#HTTP 及 HTTPS 主体配置

http {
    # 基本设置
    sendfile on;
    tcp_nopush on;
    types_hash_max_size 2048;
    include /etc/nginx/mime.types;
    default_type application/octet-stream;
    server_tokens off;

    # 日志设置
    access_log /var/log/nginx/access.log;
    error_log /var/log/nginx/error.log warn;

    # 1. HTTP 默认站
  
    server {
        listen 80;
        listen [::]:80;
        server_name your.domain.com;    #填入你的域名

        # 强制跳转到 HTTPS
        return 308 https://$host$request_uri;
    }

    # 2. 域名 HTTPS 配置：
   
    server {
        listen 127.0.0.1:10000 ssl http2;
        listen [::1]:10000 ssl http2;
        server_name your.domain.com;#填入你的域名
        
        #填入你证书路径
        ssl_certificate /home/admin/cert/domain.crt;
        #填入你证书私钥路径
        ssl_certificate_key /home/admin/cert/domain.key;


        #OCSP装订 如果你的证书不支持OCSP请不要开启 不确定是/否支持建议关闭
        #ssl_stapling on;
        #ssl_stapling_verify on;
        #resolver 8.8.8.8 1.1.1.1 valid=300s;
        #resolver_timeout 5s;

        ssl_protocols TLSv1.3 TLSv1.2;

        #不建议在未理解各协议层级作用范围的情况下随意修改 TLS1.2/1.3 cipher suite 或 ecdh_curve 顺序，否则可能导致：
        # TLS 1.2 安全性下降
        # ChaCha20 优先策略失效
        # PQC hybrid key exchange 回退
        # 兼容性下降或性能异常

        #TLS1.2 cipher
        # 配置1：仅启用现代 AEAD 套件（AES-GCM / ChaCha20-Poly1305）
        # 安全性最佳，性能较好，但不兼容部分旧版客户端（如部分旧 Safari Java）
        # 推荐对兼容性无要求的环境使用
        #ssl_ciphers ECDHE-ECDSA-AES128-GCM-SHA256:ECDHE-ECDSA-CHACHA20-POLY1305:ECDHE-ECDSA-AES256-GCM-SHA384:ECDHE-RSA-AES128-GCM-SHA256:ECDHE-RSA-CHACHA20-POLY1305:ECDHE-RSA-AES256-GCM-SHA384;
        
        # 配置2：启用 AES-CBC（SHA256/SHA384）兼容套件
        # 在保持 ECDHE 前向安全的基础上，提高旧设备兼容性
        # 相比 AEAD 套件，CBC 模式安全性和性能略逊，但目前仍可接受
        # 推荐大多数个人服务器使用
        ssl_ciphers ECDHE-ECDSA-AES128-GCM-SHA256:ECDHE-ECDSA-CHACHA20-POLY1305:ECDHE-ECDSA-AES256-GCM-SHA384:ECDHE-ECDSA-AES128-SHA256:ECDHE-ECDSA-AES256-SHA384:ECDHE-RSA-AES128-GCM-SHA256:ECDHE-RSA-CHACHA20-POLY1305:ECDHE-RSA-AES256-GCM-SHA384:ECDHE-RSA-AES128-SHA256:ECDHE-RSA-AES256-SHA384;
        
        # 配置3：启用 AES-CBC-SHA（SHA1）兼容套件
        # 用于兼容极旧客户端（例如旧版 Safari 旧版系统 老旧 Java 环境）
        # 由于 SHA1 和 CBC 模式已经过时，安全性低于前两种配置
        # 除非确实需要兼容旧设备，否则不建议启用
        #ssl_ciphers ECDHE-ECDSA-AES128-GCM-SHA256:ECDHE-ECDSA-CHACHA20-POLY1305:ECDHE-ECDSA-AES256-GCM-SHA384:ECDHE-ECDSA-AES128-SHA256:ECDHE-ECDSA-AES256-SHA384:ECDHE-ECDSA-AES128-SHA:ECDHE-ECDSA-AES256-SHA:ECDHE-RSA-AES128-GCM-SHA256:ECDHE-RSA-CHACHA20-POLY1305:ECDHE-RSA-AES256-GCM-SHA384:ECDHE-RSA-AES128-SHA256:ECDHE-RSA-AES256-SHA384:ECDHE-RSA-AES128-SHA:ECDHE-RSA-AES-256-SHA;
        
        #对于无AES-IN的设备进行CHACHA20优化 建议保持开启 
        ssl_conf_command Options PrioritizeChaCha;

        #TLS1.3 cipher 
        ssl_conf_command Ciphersuites TLS_AES_128_GCM_SHA256:TLS_CHACHA20_POLY1305_SHA256:TLS_AES_256_GCM_SHA384;   
        
        #服务器cipher优先 建议开启
        ssl_prefer_server_ciphers on;

        #session 缓存
        ssl_session_timeout 10m; #10m代表10分钟 也可改为1h(1小时) 不建议时间超过1d(1天) 时间过长可能增加旧会话密钥长期存在的风险
        ssl_session_cache shared:SSL:10m; #大约 40000 sessions
        #ssl_session_cache off;

        # TLS session ticket
        # 默认开启，用于 TLS 会话恢复，可以减少重复握手并降低 CPU 消耗
        ssl_session_tickets on;
        
        # 高安全环境可关闭 session ticket
        # 关闭后会降低会话恢复性能，但减少长期 ticket key 暴露风险
        #ssl_session_tickets off;

        #TLS1.3 0-RTT 功能 默认关闭 0-RTT 可以减少首次请求延迟 但存在重放攻击风险
        #ssl_early_data on;
    
        #X25519MLKEM768 后量子PQ混合密钥交换，需要较新 OpenSSL / Nginx 支持
        ssl_ecdh_curve X25519MLKEM768:X25519:prime256v1:secp384r1:secp521r1;

        #如果你的环境不支持 ML-KEM，可以降级为 
        #ssl_ecdh_curve X25519:prime256v1:secp384r1:secp521r1;


        # HSTS (HTTP Strict Transport Security)
        # 推荐启用以保障安全性，但请理解其不可逆影响（浏览器缓存期间，当前设置时间为6个月）
        #
        # 注意：
        # 1. 一旦设置 max-age，在有效期内无法取消
        # 2. includeSubDomains 会影响所有子域名
        # 3. 不建议在未完全确认 HTTPS 覆盖前启用 preload
        add_header Strict-Transport-Security "max-age=15552000" always;


        root /home/admin/webpage;  #填入你的网页文件路径
        index index.html;
        
        #  3. xray配置部分                                               
        
        #下方有两种写法，第一种只可以使用xhttp packet-up模式
        #第二种可以使用xhttp所有模式
        #如果你决定使用其中一种配置，请删除另一种配置示例

        #vless-xhttp 示例配置1
        location /xhttp-path {
            proxy_pass http://127.0.0.1:10001;# 填入你xray监听的地址和端口
            proxy_http_version 1.1;

            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;

            proxy_redirect off;
        }

        #vless-xhttp 示例配置2
        location /xhttp-path {
            grpc_buffer_size 16k;
            grpc_connect_timeout 60s;
            grpc_read_timeout 3600s;
            grpc_send_timeout 3600s;
            grpc_socket_keepalive on;
            grpc_pass grpc://127.0.0.1:10001; # 填入你xray监听的地址和端口
            grpc_set_header Host $host;
            grpc_set_header X-Real-IP $remote_addr;
            grpc_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            client_max_body_size 0;
            proxy_redirect off;
        }

       # 其他所有路径 → 尝试找静态文件，找不到返回 主页面

       location / {
        try_files $uri $uri/ /index.html;
       }
    }
}
